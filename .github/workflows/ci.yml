name: Backend CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sage_app
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: sage_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sage_app -d sage_lms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sage_app:local-test-password@localhost:5432/sage_lms_dev?schema=public
      TEST_DATABASE_URL: postgresql://sage_app:local-test-password@localhost:5432/sage_lms_test?schema=public
      SHADOW_DATABASE_URL: postgresql://sage_app:local-test-password@localhost:5432/sage_lms_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
